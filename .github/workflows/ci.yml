name: ci

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title)
      || format('main: {0}', github.sha) }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            terraform:
              - 'infra/terraform/**'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Install dev tools from lockfile
        run: uv sync --locked --no-default-groups --group dev
      - name: Run pre-commit on all files
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v7
      - name: Install from lockfile (dev + local-spark)
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync pytest -v

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # Single required status check for branch protection.
  # Skipped jobs (path filters) count as success; failed or cancelled do not.
  ci-success:
    needs: [pre-commit, test, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."
