[project]
name = "omnichannel-cloud-lakehouse"
version = "0.1.0"
description = "Omnichannel retail data platform built with Databricks, PySpark, dbt, and Terraform"
readme = "README.md"
authors = [
    { name = "Mateusz Janusz", email = "januszmateusz@gmail.com" }
]
requires-python = ">=3.12,<3.13"
# Runtime deps of the package itself. PySpark is provided by the platform
# (serverless) or by the chosen dependency group locally, never by the package.
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Classic local Spark (tests, local performance lens).
local-spark = [
    "pyspark>=4.2.0,<4.3.0",
]
# Spark Connect to Databricks serverless. Version must match the serverless
# environment version pinned in the bundle (pending verification, ADR-0001).
databricks = [
    "databricks-connect>=17.3,<17.4",
]

[tool.uv]
default-groups = ["dev", "local-spark"]
# pyspark and databricks-connect cannot live in the same environment.
conflicts = [
    [{ group = "local-spark" }, { group = "databricks" }],
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get spark/dbutils/display injected at runtime.
"notebooks/**" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]