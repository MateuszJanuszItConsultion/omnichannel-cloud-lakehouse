bundle:
  name: omnichannel_cloud_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by all jobs in this target

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d0b3bfa3-4aa9.cloud.databricks.com
    variables:
      catalog: omnichannel_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-d0b3bfa3-4aa9.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: omnichannel_prd
