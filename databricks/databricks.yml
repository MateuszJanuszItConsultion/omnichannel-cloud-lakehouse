# This is a Declarative Automation Bundle definition for databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks
  uuid: 21735121-6ee1-4132-a7bb-c8b8130c35b9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d0b3bfa3-4aa9.cloud.databricks.com
    variables:
      catalog: omnichannel-cloud-lakehouse
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-d0b3bfa3-4aa9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/januszmateusz@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/januszmateusz@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: omnichannel-cloud-lakehouse
      schema: prod
    permissions:
      - user_name: januszmateusz@gmail.com
        level: CAN_MANAGE
